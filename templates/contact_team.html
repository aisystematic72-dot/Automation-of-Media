<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Team</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .send-btn {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Contact Team</h1>

    <p>Please describe the issue you are facing.</p>

    <form>

        <textarea
            name="message"
            placeholder="Write your issue here..."
            required
        ></textarea>

        <button class="send-btn" type="button">
            Send
        </button>

    </form>

</div>

</body>
</html>
